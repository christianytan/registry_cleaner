[package]
name = "appcleaner"
version = "0.1.0"
edition = "2021"
description = "Find and clean orphaned / corrupted entries in the Windows Apps & Features (Uninstall) registry"

[dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = [
    "list-view",
    "textbox",
    "menu",
    "status-bar",
    "message-window",
    "frame",
    "timer",
    "combobox",
    "image-list",
    "tooltip",
] }
native-windows-derive = "1.0.5"
winreg = "0.52"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
